name: CD - Deploy para EC2

on:
  workflow_run:
    workflows: ["CI/CD - Integração e Entrega Contínua"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy na instância EC2
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy via SSH na instância EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USER }}/task-manager-app"

            if [ ! -d "$APP_DIR" ]; then
              git clone --branch main https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            npm ci --omit=dev

            pm2 restart task-manager-app || pm2 start src/server.js --name task-manager-app
            pm2 save